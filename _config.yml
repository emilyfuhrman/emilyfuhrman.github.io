# site information
name:             "EF"
description:      "Emily Fuhrman is a data artist based in London."
keywords:         "data art, data visualization, mapping, columbia, two sigma, new york, london"
url:              http://emilyfuhrman.co
permalink:        none

# post settings
defaults:
  - scope:
      path:        ''
      type:        posts
    values:
      category:    projects
      layout:      post
      is_post:     true

# Jekyll 3.x replaces (does not append to) the default exclude list,
# so the defaults are repeated here alongside our own additions.
exclude:
  - notes            # private working notes, never published
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# formatting
kramdown:
  auto_ids:        false

sass:
  style:           compressed
